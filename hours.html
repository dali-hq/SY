<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>員工出勤查詢</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f4f6f8;
            color: #263238;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        .month-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 16px 0;
        }

        .month-button {
            min-width: 80px;
            padding: 9px 18px;
            border: 1px solid #90a4ae;
            border-radius: 6px;
            background: #ffffff;
            color: #1f4e79;
            font-size: 15px;
            cursor: pointer;
        }

        .month-button:hover,
        .month-button.active {
            border-color: #1f4e79;
            background: #1f4e79;
            color: #ffffff;
        }

        .search-box {
            margin: 20px 0;
        }

        #searchInput {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #b0bec5;
            border-radius: 8px;
            background: #ffffff;
            font-size: 16px;
        }

        #searchInput:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
        }

        .location-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #d8e0e5;
            border-radius: 8px;
        }

        .location-nav-title {
            width: 100%;
            color: #455a64;
            font-size: 15px;
            font-weight: bold;
        }

        .location-link {
            padding: 8px 12px;
            border: 1px solid #90a4ae;
            border-radius: 6px;
            background: #f8fafb;
            color: #1f4e79;
            font-size: 14px;
            cursor: pointer;
        }

        .location-link:hover,
        .location-link.active {
            border-color: #1f4e79;
            background: #1f4e79;
            color: #ffffff;
        }

        #resultInfo {
            margin: 14px 0;
            color: #607d8b;
        }

        .location-card {
            margin-bottom: 20px;
            overflow: hidden;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            scroll-margin-top: 20px;
        }

        .location-title {
            padding: 12px 16px;
            background: #1f4e79;
            color: #ffffff;
            font-size: 19px;
            font-weight: bold;
        }

        .employee-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(120px, 1fr));
            gap: 10px;
            padding: 16px;
        }

        .employee-item {
            display: block;
            padding: 12px 8px;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            background: #fafafa;
            color: #263238;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .employee-item:hover {
            border-color: #1976d2;
            background: #e3f2fd;
            color: #0d47a1;
        }

        .attendance-card {
            padding: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .top-back-button {
            margin-bottom: 16px;
            padding: 9px 16px;
            border: 0;
            border-radius: 6px;
            background: #1f4e79;
            color: #ffffff;
            cursor: pointer;
        }

        .top-back-button:hover {
            background: #163a5a;
        }

        .attendance-card h2 {
            margin-top: 0;
            color: #1f4e79;
        }

        .employee-info {
            margin-bottom: 18px;
            line-height: 1.8;
            font-size: 16px;
        }

        .attendance-wrapper {
            overflow-x: auto;
        }

        .attendance-table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
            table-layout: fixed;
            background: #ffffff;
        }

        .attendance-table th,
        .attendance-table td {
            padding: 9px 5px;
            border: 1px solid #90a4ae;
            text-align: center;
            word-break: break-word;
        }

        .attendance-table th {
            background: #e3f2fd;
            color: #1f4e79;
        }

        .attendance-table th:nth-child(1),
        .attendance-table td:nth-child(1) {
            width: 17%;
        }

        .attendance-table th:nth-child(2),
        .attendance-table td:nth-child(2) {
            width: 29%;
        }

        .attendance-table th:nth-child(3),
        .attendance-table td:nth-child(3),
        .attendance-table th:nth-child(4),
        .attendance-table td:nth-child(4) {
            width: 20%;
        }

        .attendance-table th:nth-child(5),
        .attendance-table td:nth-child(5) {
            width: 14%;
        }

        .status-rest {
            color: #616161;
        }

        .status-error {
            color: #c62828;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .print-button {
            padding: 9px 16px;
            border: 0;
            border-radius: 6px;
            background: #2e7d32;
            color: #ffffff;
            cursor: pointer;
        }

        .print-button:hover {
            background: #1b5e20;
        }

        #noResult {
            display: none;
            padding: 24px;
            background: #ffffff;
            border-radius: 8px;
            color: #78909c;
            text-align: center;
        }

        #loading {
            padding: 24px;
            color: #607d8b;
            text-align: center;
        }

        #errorMessage {
            display: none;
            padding: 16px;
            background: #ffebee;
            border-radius: 8px;
            color: #b71c1c;
        }

        @media (max-width: 1000px) {
            .employee-grid {
                grid-template-columns: repeat(4, minmax(140px, 1fr));
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .employee-grid {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
                gap: 8px;
                padding: 10px;
            }

            .employee-item {
                font-size: 14px;
            }

            .attendance-card {
                padding: 12px;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            body {
                padding: 0;
                background: #ffffff;
                color: #000000;
            }

            .container {
                width: 100%;
                max-width: none;
            }

            h1,
            .month-nav,
            .search-box,
            .location-nav,
            #resultInfo,
            #loading,
            #errorMessage,
            #noResult,
            .top-back-button,
            .button-group {
                display: none !important;
            }

            .attendance-card {
                width: 100%;
                padding: 0;
                box-shadow: none;
                border-radius: 0;
            }

            .attendance-card h2 {
                margin: 0 0 8px;
                color: #000000;
                font-size: 16pt;
            }

            .employee-info {
                margin-bottom: 10px;
                line-height: 1.5;
                font-size: 10pt;
            }

            .attendance-wrapper {
                overflow: visible;
            }

            .attendance-table {
                width: 100%;
                min-width: 0;
                table-layout: fixed;
                font-size: 8.5pt;
            }

            .attendance-table th,
            .attendance-table td {
                padding: 4px 2px;
                border: 1px solid #000000;
                color: #000000;
                word-break: break-all;
            }

            .attendance-table th {
                background: #ffffff;
                color: #000000;
            }

            .attendance-table th:nth-child(1),
            .attendance-table td:nth-child(1) {
                width: 17%;
            }

            .attendance-table th:nth-child(2),
            .attendance-table td:nth-child(2) {
                width: 29%;
            }

            .attendance-table th:nth-child(3),
            .attendance-table td:nth-child(3),
            .attendance-table th:nth-child(4),
            .attendance-table td:nth-child(4) {
                width: 20%;
            }

            .attendance-table th:nth-child(5),
            .attendance-table td:nth-child(5) {
                width: 14%;
            }

            .attendance-table tr {
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>員工出勤查詢</h1>

        <div id="monthNav" class="month-nav"></div>

        <div class="search-box">
            <input
                type="search"
                id="searchInput"
                placeholder="請輸入員編或姓名"
                autocomplete="off"
            >
        </div>

        <div id="locationNav" class="location-nav"></div>
        <div id="resultInfo"></div>

        <div id="loading">
            資料載入中...
        </div>

        <div id="errorMessage">
            JSON 資料載入失敗，請確認月份檔案名稱與位置。
        </div>

        <div id="employeeContainer"></div>

        <div id="noResult">
            找不到符合的員工資料
        </div>
    </main>

    <script>
        let employeeData = [];
        let currentMonth = "10月";

        const monthFiles = {
            "9月": "員工出勤資料_09月.json",
            "10月": "員工出勤資料_10月.json"
        };

        const monthData = {};

        const monthNav =
            document.getElementById("monthNav");

        const searchInput =
            document.getElementById("searchInput");

        const locationNav =
            document.getElementById("locationNav");

        const employeeContainer =
            document.getElementById("employeeContainer");

        const noResult =
            document.getElementById("noResult");

        const resultInfo =
            document.getElementById("resultInfo");

        const loading =
            document.getElementById("loading");

        const errorMessage =
            document.getElementById("errorMessage");


        function sortEmployees(data) {
            return data.sort((a, b) => {
                const locationCompare =
                    String(a.顯示門別).localeCompare(
                        String(b.顯示門別),
                        "zh-Hant"
                    );

                if (locationCompare !== 0) {
                    return locationCompare;
                }

                return Number(a.員編) - Number(b.員編);
            });
        }


        function renderMonthNavigation() {
            monthNav.innerHTML = "";

            Object.keys(monthFiles).forEach(month => {
                const button =
                    document.createElement("button");

                button.type = "button";
                button.className = "month-button";
                button.textContent = month;

                if (month === currentMonth) {
                    button.classList.add("active");
                }

                button.addEventListener(
                    "click",
                    () => {
                        currentMonth = month;
                        employeeData = monthData[month];

                        searchInput.value = "";
                        locationNav.style.display = "flex";

                        document
                            .querySelectorAll(".month-button")
                            .forEach(item =>
                                item.classList.remove("active")
                            );

                        button.classList.add("active");

                        renderLocationNavigation(employeeData);
                        renderEmployees();
                    }
                );

                monthNav.appendChild(button);
            });
        }


        function renderLocationNavigation(data) {
            locationNav.innerHTML = "";

            const title =
                document.createElement("div");

            title.className = "location-nav-title";
            title.textContent = "門別快速前往";

            locationNav.appendChild(title);

            const locations = [
                ...new Set(
                    data.map(employee => employee.顯示門別)
                )
            ].sort((a, b) =>
                a.localeCompare(b, "zh-Hant")
            );

            locations.forEach(location => {
                const button =
                    document.createElement("button");

                button.type = "button";
                button.className = "location-link";
                button.textContent = location;

                button.addEventListener(
                    "click",
                    () => {
                        const target = [
                            ...document.querySelectorAll(
                                ".location-card"
                            )
                        ].find(card =>
                            card.dataset.location === location
                        );

                        if (target) {
                            target.scrollIntoView({
                                behavior: "smooth",
                                block: "start"
                            });
                        }

                        document
                            .querySelectorAll(".location-link")
                            .forEach(link =>
                                link.classList.remove("active")
                            );

                        button.classList.add("active");
                    }
                );

                locationNav.appendChild(button);
            });
        }


        function renderEmployees(keyword = "") {
            const searchText =
                keyword.trim().toLowerCase();

            const filteredData =
                sortEmployees(
                    employeeData.filter(employee => {
                        const employeeId =
                            String(employee.員編)
                                .toLowerCase();

                        const employeeName =
                            String(employee.姓名)
                                .toLowerCase();

                        return (
                            employeeId.includes(searchText) ||
                            employeeName.includes(searchText)
                        );
                    })
                );

            employeeContainer.innerHTML = "";

            resultInfo.textContent =
                `${currentMonth}：共 ${filteredData.length} 位員工`;

            if (filteredData.length === 0) {
                noResult.style.display = "block";
                return;
            }

            noResult.style.display = "none";

            const grouped = {};

            filteredData.forEach(employee => {
                const location =
                    employee.顯示門別;

                if (!grouped[location]) {
                    grouped[location] = [];
                }

                grouped[location].push(employee);
            });

            Object.keys(grouped)
                .sort((a, b) =>
                    a.localeCompare(b, "zh-Hant")
                )
                .forEach(location => {
                    const card =
                        document.createElement("section");

                    card.className = "location-card";
                    card.dataset.location = location;

                    const title =
                        document.createElement("div");

                    title.className = "location-title";
                    title.textContent = location;

                    const grid =
                        document.createElement("div");

                    grid.className = "employee-grid";

                    grouped[location]
                        .sort((a, b) =>
                            Number(a.員編) - Number(b.員編)
                        )
                        .forEach(employee => {
                            const item =
                                document.createElement("a");

                            item.className = "employee-item";
                            item.href = "#";
                            item.textContent =
                                `${employee.員編} ${employee.姓名}`;

                            item.addEventListener(
                                "click",
                                event => {
                                    event.preventDefault();
                                    openAttendance(employee);
                                }
                            );

                            grid.appendChild(item);
                        });

                    card.append(title, grid);
                    employeeContainer.appendChild(card);
                });
        }


        function getAttendanceStatus(day) {
            const earliest =
                String(day.最早時間 || "").trim();

            const latest =
                String(day.最晚時間 || "").trim();

            if (!earliest && !latest) {
                return {
                    text: "休",
                    className: "status-rest"
                };
            }

            if (
                earliest &&
                latest &&
                earliest === latest
            ) {
                return {
                    text: "異常",
                    className: "status-error"
                };
            }

            return {
                text: "",
                className: ""
            };
        }


        function openAttendance(employee) {
            locationNav.style.display = "none";

            resultInfo.textContent =
                `${currentMonth}｜${employee.員編} ${employee.姓名}`;

            employeeContainer.innerHTML = "";
            noResult.style.display = "none";

            const card =
                document.createElement("section");

            card.className = "attendance-card";

            const topBackButton =
                document.createElement("button");

            topBackButton.type = "button";
            topBackButton.className = "top-back-button";
            topBackButton.textContent = "返回員工列表";

            topBackButton.addEventListener(
                "click",
                () => {
                    locationNav.style.display = "flex";
                    renderLocationNavigation(employeeData);
                    renderEmployees(searchInput.value);

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }
            );

            const title =
                document.createElement("h2");

            title.textContent =
                `${currentMonth}｜${employee.顯示門別}`;

            const info =
                document.createElement("div");

            info.className = "employee-info";

            info.innerHTML = `
                <div>
                    員工姓名：${employee.員編} ${employee.姓名}
                </div>

                <div>
                    卡號：${employee.卡號 || ""}
                </div>
            `;

            const wrapper =
                document.createElement("div");

            wrapper.className = "attendance-wrapper";

            const table =
                document.createElement("table");

            table.className = "attendance-table";

            table.innerHTML = `
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>門別</th>
                        <th>最早時間<br>上班</th>
                        <th>最晚時間<br>下班</th>
                        <th>狀態</th>
                    </tr>
                </thead>

                <tbody>
                    ${(employee.出勤 || [])
                        .map(day => {
                            const status =
                                getAttendanceStatus(day);

                            return `
                                <tr>
                                    <td>${day.日期 || ""}</td>
                                    <td>${day.門別 || ""}</td>
                                    <td>${day.最早時間 || ""}</td>
                                    <td>${day.最晚時間 || ""}</td>
                                    <td class="${status.className}">
                                        ${status.text}
                                    </td>
                                </tr>
                            `;
                        })
                        .join("")}
                </tbody>
            `;

            wrapper.appendChild(table);

            const buttonGroup =
                document.createElement("div");

            buttonGroup.className = "button-group";

            const printButton =
                document.createElement("button");

            printButton.className = "print-button";
            printButton.textContent = "列印工表";

            printButton.addEventListener(
                "click",
                () => window.print()
            );

            buttonGroup.appendChild(printButton);

            card.append(
                topBackButton,
                title,
                info,
                wrapper,
                buttonGroup
            );

            employeeContainer.appendChild(card);

            card.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }


        searchInput.addEventListener(
            "input",
            event => {
                const keyword =
                    event.target.value
                        .trim()
                        .toLowerCase();

                const filteredNavigationData =
                    employeeData.filter(employee => {
                        const employeeId =
                            String(employee.員編)
                                .toLowerCase();

                        const employeeName =
                            String(employee.姓名)
                                .toLowerCase();

                        return (
                            employeeId.includes(keyword) ||
                            employeeName.includes(keyword)
                        );
                    });

                locationNav.style.display = "flex";

                renderLocationNavigation(
                    filteredNavigationData
                );

                renderEmployees(
                    event.target.value
                );
            }
        );


        Promise.all(
            Object.entries(monthFiles).map(
                ([month, fileName]) => {
                    return fetch(fileName)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(
                                    `${fileName} 載入失敗`
                                );
                            }

                            return response.json();
                        })
                        .then(data => {
                            monthData[month] = data;
                        });
                }
            )
        )
            .then(() => {
                employeeData =
                    monthData[currentMonth];

                renderMonthNavigation();

                loading.style.display = "none";
                renderLocationNavigation(employeeData);
                renderEmployees();
            })
            .catch(error => {
                console.error(error);

                loading.style.display = "none";
                errorMessage.textContent =
                    "月份 JSON 載入失敗，請確認檔案名稱與位置。";

                errorMessage.style.display = "block";
            });
    </script>
</body>
</html>
