<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>員工門別查詢</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f4f6f8;
            color: #263238;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #1f4e79;
        }

        .search-box {
            margin: 20px 0;
        }

        #searchInput {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #b0bec5;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        #searchInput:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
        }

        #resultInfo {
            margin-bottom: 16px;
            color: #607d8b;
        }

        .location-card {
            margin-bottom: 20px;
            overflow: hidden;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .location-title {
            padding: 12px 16px;
            background: #1f4e79;
            color: white;
            font-size: 19px;
            font-weight: bold;
        }

        .employee-grid {
            display: grid;

            /* 電腦版每列 8 位 */
            grid-template-columns: repeat(8, minmax(120px, 1fr));

            gap: 10px;
            padding: 16px;
        }

        .employee-item {
            display: block;
            padding: 12px 8px;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            background: #fafafa;
            color: #263238;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .employee-item:hover {
            border-color: #1976d2;
            background: #e3f2fd;
            color: #0d47a1;
        }

        #noResult {
            display: none;
            padding: 24px;
            text-align: center;
            background: white;
            border-radius: 8px;
            color: #78909c;
        }

        #loading {
            padding: 24px;
            text-align: center;
            color: #607d8b;
        }

        #errorMessage {
            display: none;
            padding: 16px;
            color: #b71c1c;
            background: #ffebee;
            border-radius: 8px;
        }

        /* 平板：每列 4 位 */
        @media (max-width: 1000px) {
            .employee-grid {
                grid-template-columns: repeat(4, minmax(140px, 1fr));
            }
        }

        /* 手機：每列 2 位 */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .employee-grid {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
                gap: 8px;
                padding: 10px;
            }

            .employee-item {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>員工門別查詢</h1>

        <div class="search-box">
            <input
                type="search"
                id="searchInput"
                placeholder="請輸入員編或姓名"
                autocomplete="off"
            >
        </div>
        
        <div id="locationNav" class="location-nav"></div>

        <div id="resultInfo"></div>

        <div id="loading">
            資料載入中...
        </div>

        <div id="errorMessage">
            JSON 資料載入失敗，請確認 JSON 檔案位置。
        </div>

        <div id="employeeContainer"></div>

        <div id="noResult">
            找不到符合的員工資料
        </div>
    </main>

    <script>
        let employeeData = [];

        const searchInput =
            document.getElementById("searchInput");

        const employeeContainer =
            document.getElementById("employeeContainer");

        const noResult =
            document.getElementById("noResult");

        const resultInfo =
            document.getElementById("resultInfo");

        const loading =
            document.getElementById("loading");

        const errorMessage =
            document.getElementById("errorMessage");

        function renderEmployees(keyword = "") {
            const searchText = keyword.trim().toLowerCase();

            // 依員編或姓名搜尋
            const filteredData = employeeData.filter(employee => {
                const employeeId =
                    String(employee.員編).toLowerCase();

                const employeeName =
                    String(employee.姓名).toLowerCase();

                return (
                    employeeId.includes(searchText) ||
                    employeeName.includes(searchText)
                );
            });

            // 依顯示門別，再依員編升冪
            filteredData.sort((a, b) => {
                const locationCompare =
                    String(a.顯示門別).localeCompare(
                        String(b.顯示門別),
                        "zh-Hant"
                    );

                if (locationCompare !== 0) {
                    return locationCompare;
                }

                return Number(a.員編) - Number(b.員編);
            });

            employeeContainer.innerHTML = "";

            resultInfo.textContent =
                `共 ${filteredData.length} 位員工`;

            if (filteredData.length === 0) {
                noResult.style.display = "block";
                return;
            }

            noResult.style.display = "none";

            // 依顯示門別分組
            const groupedByLocation = {};

            filteredData.forEach(employee => {
                const location = employee.顯示門別;

                if (!groupedByLocation[location]) {
                    groupedByLocation[location] = [];
                }

                groupedByLocation[location].push(employee);
            });

            // 建立門別區塊
            Object.keys(groupedByLocation)
                .sort((a, b) => a.localeCompare(b, "zh-Hant"))
                .forEach(location => {
                    const locationCard =
                        document.createElement("section");

                    locationCard.className = "location-card";

                    const locationTitle =
                        document.createElement("div");

                    locationTitle.className = "location-title";
                    locationTitle.textContent = location;

                    const employeeGrid =
                        document.createElement("div");

                    employeeGrid.className = "employee-grid";

                    groupedByLocation[location]
                        .sort((a, b) => Number(a.員編) - Number(b.員編))
                        .forEach(employee => {
                            const employeeItem =
                                document.createElement("a");

                            employeeItem.className = "employee-item";
                            employeeItem.href = "#";

                            employeeItem.textContent =
                                `${employee.員編} ${employee.姓名}`;

                            // 預留給日後開啟個人工表
                            employeeItem.addEventListener(
                                "click",
                                event => {
                                    event.preventDefault();

                                    alert(
                                        `之後將開啟 ${employee.員編} ${employee.姓名} 的當月工表`
                                    );
                                }
                            );

                            employeeGrid.appendChild(employeeItem);
                        });

                    locationCard.appendChild(locationTitle);
                    locationCard.appendChild(employeeGrid);
                    employeeContainer.appendChild(locationCard);
                });
        }

        // 輸入員編或姓名時即時篩選
        searchInput.addEventListener("input", event => {
            renderEmployees(event.target.value);
        });

        // 載入 JSON
        fetch("員工最後門別.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error(
                        `HTTP 錯誤：${response.status}`
                    );
                }

                return response.json();
            })
            .then(data => {
                employeeData = data;
                loading.style.display = "none";
                renderEmployees();
            })
            .catch(error => {
                console.error(error);
                loading.style.display = "none";
                errorMessage.style.display = "block";
            });
    </script>
</body>
</html>
