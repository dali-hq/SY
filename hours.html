<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工出勤系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls select, .controls button {
            padding: 10px 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .controls select:focus, .controls button:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .controls button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .table-container {
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        thead th {
            padding: 15px 10px;
            text-align: center;
            font-weight: 600;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr {
            border-bottom: 1px solid #dee2e6;
            transition: all 0.3s;
        }

        tbody tr:hover {
            background: #f8f9fa;
            transform: scale(1.01);
        }

        tbody td {
            padding: 12px 10px;
            text-align: center;
            vertical-align: middle;
        }

        .employee-row td {
            font-weight: 600;
            background: #e9ecef;
        }

        .attendance-row td {
            background: white;
        }

        .work-hours-8 {
            color: #28a745;
            font-weight: bold;
        }

        .work-hours-4 {
            color: #fd7e14;
            font-weight: bold;
        }

        .work-hours-none {
            color: #dc3545;
            font-weight: bold;
        }

        .system-ot-2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        .system-ot-1 {
            background: #fd7e14;
            color: white;
            font-weight: bold;
        }

        .status-abnormal {
            color: #dc3545;
            font-weight: bold;
        }

        .status-half {
            color: #fd7e14;
            font-weight: bold;
        }

        .late-positive {
            color: #dc3545;
            font-weight: bold;
        }

        .date-cell {
            white-space: nowrap;
            font-weight: 500;
        }

        .location-cell {
            white-space: nowrap;
        }

        .time-cell {
            white-space: nowrap;
            font-family: 'Courier New', monospace;
        }

        .note-cell {
            min-width: 100px;
        }

        .note-input {
            width: 100%;
            padding: 5px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            table {
                font-size: 11px;
            }

            thead th {
                padding: 10px 5px;
            }

            tbody td {
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 員工出勤系統</h1>
            <p>出勤資料視覺化與分析</p>
        </div>

        <div class="controls">
            <select id="locationFilter">
                <option value="">全部門別</option>
            </select>
            <select id="employeeFilter">
                <option value="">全部員工</option>
            </select>
            <button onclick="renderTable()">🔄 重新整理</button>
            <button onclick="exportToCSV()">📥 匯出 CSV</button>
        </div>

        <div class="table-container">
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>門別</th>
                        <th>員編</th>
                        <th>姓名</th>
                        <th>卡號</th>
                        <th>遲到累計 (min)</th>
                        <th>日期</th>
                        <th>門別</th>
                        <th>上班</th>
                        <th>下班</th>
                        <th>工時</th>
                        <th>系統加班</th>
                        <th>狀態</th>
                        <th>備註</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let attendanceData = [];
        let filteredData = [];

        // 設定要載入的月分檔案（無空格）
        const MONTHS_TO_LOAD = [
            '員工出勤資料_09月.json',
            '員工出勤資料_10月.json'
        ];

        // 門別簡稱對照
        const locationShortNames = {
            "11305 北港臉型機": "北港",
            "11203 大里農會": "大里",
            "11301 南七": "南七",
            "11402 嘉義配水池": "嘉配",
            "10001 大門": "總公司",
            "11211 九樓": "總公司"
        };

        // 載入 JSON 資料
        async function loadData() {
            try {
                const responses = await Promise.all(
                    MONTHS_TO_LOAD.map(fileName => fetch(fileName))
                );

                const monthlyData = await Promise.all(
                    responses.map(response => {
                        if (!response.ok) {
                            throw new Error(`無法載入檔案：${response.url}`);
                        }
                        return response.json();
                    })
                );

                attendanceData = mergeMonthlyData(monthlyData);
                filteredData = attendanceData;

                initFilters();
                renderTable();
            } catch (error) {
                console.error('載入資料失敗：', error);
                alert(`載入資料失敗：${error.message}`);
            }
        }

        // 合併多個月分資料
        function mergeMonthlyData(monthlyDataList) {
            const employeeMap = new Map();

            monthlyDataList.forEach(monthData => {
                monthData.forEach(employee => {
                    const employeeId = String(employee.員編);

                    if (!employeeMap.has(employeeId)) {
                        employeeMap.set(employeeId, {
                            ...employee,
                            出勤: [...(employee.出勤 || [])],
                            遲到累計: Number(employee.遲到累計 || 0)
                        });
                    } else {
                        const existing = employeeMap.get(employeeId);

                        existing.出勤.push(...(employee.出勤 || []));
                        existing.遲到累計 += Number(employee.遲到累計 || 0);
                    }
                });
            });

            for (const employee of employeeMap.values()) {
                employee.出勤.sort((a, b) => {
                    return String(a.日期).localeCompare(String(b.日期));
                });
            }

            return Array.from(employeeMap.values());
        }

        // 初始化篩選器
        function initFilters() {
            const locationFilter = document.getElementById('locationFilter');
            const employeeFilter = document.getElementById('employeeFilter');

            locationFilter.innerHTML = '<option value="">全部門別</option>';
            employeeFilter.innerHTML = '<option value="">全部員工</option>';

            const locations = [...new Set(attendanceData.map(emp => emp.顯示門別))];
            locations.sort().forEach(loc => {
                const option = document.createElement('option');
                option.value = loc;
                option.textContent = loc;
                locationFilter.appendChild(option);
            });

            attendanceData.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.員編;
                option.textContent = `${emp.姓名} (${emp.員編})`;
                employeeFilter.appendChild(option);
            });

            locationFilter.addEventListener('change', filterData);
            employeeFilter.addEventListener('change', filterData);
        }

        // 篩選資料
        function filterData() {
            const locationFilter = document.getElementById('locationFilter').value;
            const employeeFilter = document.getElementById('employeeFilter').value;

            filteredData = attendanceData.filter(emp => {
                const matchLocation = !locationFilter || emp.顯示門別 === locationFilter;
                const matchEmployee = !employeeFilter || emp.員編 === employeeFilter;
                return matchLocation && matchEmployee;
            });

            renderTable();
        }

        // 取得門別簡稱
        function getLocationShortName(locationFull) {
            if (!locationFull || locationFull === "nan") return "";

            const shortName = locationShortNames[locationFull];
            if (shortName) return shortName;

            if (locationFull.includes("北港")) return "北港";
            if (locationFull.includes("大里")) return "大里";
            if (locationFull.includes("南七")) return "南七";
            if (locationFull.includes("嘉義")) return "嘉配";
            if (locationFull.includes("大門") || locationFull.includes("九樓")) return "總公司";

            return locationFull;
        }

        // 渲染表格
        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            filteredData.forEach(employee => {
                const employeeRow = document.createElement('tr');
                employeeRow.className = 'employee-row';

                const locationCell = document.createElement('td');
                locationCell.textContent = employee.顯示門別;
                locationCell.colSpan = 4;

                const lateCell = document.createElement('td');
                lateCell.textContent = employee.遲到累計 || 0;
                if ((employee.遲到累計 || 0) > 0) {
                    lateCell.className = 'late-positive';
                }

                employeeRow.appendChild(locationCell);
                employeeRow.appendChild(lateCell);
                tableBody.appendChild(employeeRow);

                employee.出勤.forEach(day => {
                    const attendanceRow = document.createElement('tr');
                    attendanceRow.className = 'attendance-row';

                    const dateCell = document.createElement('td');
                    dateCell.className = 'date-cell';
                    const dateObj = new Date(day.日期);
                    dateCell.textContent = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                    attendanceRow.appendChild(dateCell);

                    const locationShortCell = document.createElement('td');
                    locationShortCell.className = 'location-cell';
                    locationShortCell.textContent = day.門別簡稱 || getLocationShortName(day.門別);
                    attendanceRow.appendChild(locationShortCell);

                    const startTimeCell = document.createElement('td');
                    startTimeCell.className = 'time-cell';
                    startTimeCell.textContent = day.最早時間 || '';
                    attendanceRow.appendChild(startTimeCell);

                    const endTimeCell = document.createElement('td');
                    endTimeCell.className = 'time-cell';
                    endTimeCell.textContent = day.最晚時間 || '';
                    attendanceRow.appendChild(endTimeCell);

                    const workHoursCell = document.createElement('td');
                    if (day.工時 === null || day.工時 === undefined) {
                        workHoursCell.textContent = '';
                        workHoursCell.className = 'work-hours-none';
                    } else {
                        workHoursCell.textContent = day.工時;
                        if (day.工時 === 8) {
                            workHoursCell.className = 'work-hours-8';
                        } else if (day.工時 === 4) {
                            workHoursCell.className = 'work-hours-4';
                        }
                    }
                    attendanceRow.appendChild(workHoursCell);

                    const systemOtCell = document.createElement('td');
                    if (day.系統加班 === null || day.系統加班 === undefined) {
                        systemOtCell.textContent = '';
                    } else {
                        systemOtCell.textContent = day.系統加班;
                        if (day.系統加班 === 2) {
                            systemOtCell.className = 'system-ot-2';
                        } else if (day.系統加班 === 1) {
                            systemOtCell.className = 'system-ot-1';
                        }
                    }
                    attendanceRow.appendChild(systemOtCell);

                    const statusCell = document.createElement('td');
                    if (!day.狀態 || day.狀態 === "") {
                        statusCell.textContent = '';
                    } else {
                        statusCell.textContent = day.狀態;
                        if (day.狀態 === "異常") {
                            statusCell.className = 'status-abnormal';
                        } else if (day.狀態 === "上半天") {
                            statusCell.className = 'status-half';
                        }
                    }
                    attendanceRow.appendChild(statusCell);

                    const noteCell = document.createElement('td');
                    noteCell.className = 'note-cell';
                    const noteInput = document.createElement('input');
                    noteInput.type = 'text';
                    noteInput.className = 'note-input';
                    noteInput.value = day.備註 || '';
                    noteInput.placeholder = '輸入備註';
                    noteCell.appendChild(noteInput);
                    attendanceRow.appendChild(noteCell);

                    tableBody.appendChild(attendanceRow);
                });
            });
        }

        // 匯出 CSV
        function exportToCSV() {
            let csv = '門別，員編，姓名，卡號，遲到累計，日期，門別簡稱，上班，下班，工時，系統加班，狀態，備註\n';

            filteredData.forEach(employee => {
                employee.出勤.forEach(day => {
                    const dateObj = new Date(day.日期);
                    const dateStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                    const locationShort = day.門別簡稱 || getLocationShortName(day.門別);
                    const workHours = (day.工時 === null || day.工時 === undefined) ? '' : day.工時;
                    const systemOt = (day.系統加班 === null || day.系統加班 === undefined) ? '' : day.系統加班;
                    const status = day.狀態 || '';
                    const note = day.備註 || '';

                    csv += `${employee.顯示門別},${employee.員編},${employee.姓名},${employee.卡號},${employee.遲到累計 || 0},${dateStr},${locationShort},${day.最早時間 || ''},${day.最晚時間 || ''},${workHours},${systemOt},${status},${note}\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '員工出勤資料.csv';
            link.click();
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
