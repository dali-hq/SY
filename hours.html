<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>員工出勤查詢</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f4f6f8;color:#263238;font-family:Arial,"Microsoft JhengHei",sans-serif}.container{max-width:1400px;margin:auto}h1{text-align:center;color:#1f4e79}.search-box{margin:20px 0}#searchInput{width:100%;padding:12px 16px;border:1px solid #b0bec5;border-radius:8px;font-size:16px;background:#fff}#searchInput:focus{outline:none;border-color:#1976d2;box-shadow:0 0 0 3px #1976d226}.location-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;padding:12px;background:#fff;border:1px solid #d8e0e5;border-radius:8px}.location-nav-title{width:100%;color:#455a64;font-size:15px;font-weight:bold}.location-link{padding:8px 12px;border:1px solid #90a4ae;border-radius:6px;background:#f8fafb;color:#1f4e79;font-size:14px;cursor:pointer}.location-link:hover,.location-link.active{background:#1f4e79;border-color:#1f4e79;color:#fff}#resultInfo{margin:14px 0;color:#607d8b}.location-card{margin-bottom:20px;overflow:hidden;background:#fff;border-radius:10px;box-shadow:0 2px 8px #00000014;scroll-margin-top:20px}.location-title{padding:12px 16px;background:#1f4e79;color:#fff;font-size:19px;font-weight:bold}.employee-grid{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:10px;padding:16px}.employee-item{display:block;padding:12px 8px;border:1px solid #cfd8dc;border-radius:6px;background:#fafafa;color:#263238;text-align:center;text-decoration:none;font-size:15px;cursor:pointer}.employee-item:hover{border-color:#1976d2;background:#e3f2fd;color:#0d47a1}.attendance-card{padding:20px;background:#fff;border-radius:10px;box-shadow:0 2px 8px #00000014}.attendance-card h2{margin-top:0;color:#1f4e79}.employee-info{margin-bottom:18px;line-height:1.8;font-size:16px}.attendance-wrapper{overflow-x:auto}.attendance-table{width:100%;min-width:680px;border-collapse:collapse;table-layout:fixed;background:#fff}.attendance-table th,.attendance-table td{padding:10px;border:1px solid #90a4ae;text-align:center;word-break:break-word}.attendance-table th{background:#e3f2fd;color:#1f4e79}.attendance-table th:nth-child(1),.attendance-table td:nth-child(1){width:20%}.attendance-table th:nth-child(2),.attendance-table td:nth-child(2){width:35%}.attendance-table th:nth-child(3),.attendance-table td:nth-child(3),.attendance-table th:nth-child(4),.attendance-table td:nth-child(4){width:22.5%}.back-button{margin-top:18px;padding:9px 16px;border:0;border-radius:6px;background:#1f4e79;color:#fff;cursor:pointer}.back-button:hover{background:#163a5a}#noResult{display:none;padding:24px;text-align:center;background:#fff;border-radius:8px;color:#78909c}#loading{padding:24px;text-align:center;color:#607d8b}#errorMessage{display:none;padding:16px;color:#b71c1c;background:#ffebee;border-radius:8px}@media(max-width:1000px){.employee-grid{grid-template-columns:repeat(4,minmax(140px,1fr))}}@media(max-width:600px){body{padding:12px}.employee-grid{grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px;padding:10px}.employee-item{font-size:14px}.attendance-card{padding:12px}}
</style>
</head>
<body>
<main class="container">
<h1>員工出勤查詢</h1>
<div class="search-box"><input type="search" id="searchInput" placeholder="請輸入員編或姓名" autocomplete="off"></div>
<div id="locationNav" class="location-nav"></div>
<div id="resultInfo"></div>
<div id="loading">資料載入中...</div>
<div id="errorMessage">JSON 資料載入失敗，請確認檔案名稱與位置。</div>
<div id="employeeContainer"></div>
<div id="noResult">找不到符合的員工資料</div>
</main>

<script>
let employeeData=[];const searchInput=document.getElementById("searchInput"),locationNav=document.getElementById("locationNav"),
  employeeContainer=document.getElementById("employeeContainer"),noResult=document.getElementById("noResult"),
  resultInfo=document.getElementById("resultInfo"),loading=document.getElementById("loading"),errorMessage=document.getElementById("errorMessage");

function sortEmployees(data){return data.sort((a,b)=>{const 
  locationCompare=String(a.顯示門別).localeCompare(String(b.顯示門別),"zh-Hant");return locationCompare||Number(a.員編)-Number(b.員編)})}

function renderLocationNavigation(data){locationNav.innerHTML="";const 
  title=document.createElement("div");title.className="location-nav-title";title.textContent="門別快速前往";locationNav.appendChild(title);const 
  locations=[...new Set(data.map(e=>e.顯示門別))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));locations.forEach(
  location=>{const button=document.createElement("button");button.type="button";button.className="location-link";button.textContent=location;button.addEventListener("click",()=>{const 
    target=[...document.querySelectorAll(".location-card")].find(card=>card.dataset.location===location);if(target)target.scrollIntoView({behavior:"smooth",block:"start"});document.querySelectorAll(".location-link").forEach(link=>link.classList.remove("active"));button.classList.add("active")});locationNav.appendChild(button)})}

function renderEmployees(keyword=""){const searchText=keyword.trim().toLowerCase(),
  filteredData=sortEmployees(employeeData.filter(e=>String(e.員編).toLowerCase().includes(searchText)||String(e.姓名).toLowerCase().includes(searchText)));employeeContainer.innerHTML="";resultInfo.textContent=`共 ${filteredData.length} 位員工`;if(!filteredData.length){noResult.style.display="block";return}noResult.style.display="none";const grouped={};filteredData.forEach(e=>(grouped[e.顯示門別]??=[]).push(e));Object.keys(grouped).sort((a,b)=>a.localeCompare(b,"zh-Hant")).forEach(location=>{const card=document.createElement("section");card.className="location-card";card.dataset.location=location;const title=document.createElement("div");title.className="location-title";title.textContent=location;const grid=document.createElement("div");grid.className="employee-grid";grouped[location].sort((a,b)=>Number(a.員編)-Number(b.員編)).forEach(e=>{const item=document.createElement("a");item.className="employee-item";item.href="#";item.textContent=`${e.員編} ${e.姓名}`;item.addEventListener("click",event=>{event.preventDefault();openAttendance(e)});grid.appendChild(item)});card.append(title,grid);employeeContainer.appendChild(card)})}

function openAttendance(employee){locationNav.style.display="none";resultInfo.textContent=`${employee.員編} ${employee.姓名} 的當月出勤資料`;
                                  employeeContainer.innerHTML="";noResult.style.display="none";const card=document.createElement("section");card.className="attendance-card";const 
                                    title=document.createElement("h2");title.textContent=employee.顯示門別;const info=document.createElement("div");info.className="employee-info";info.innerHTML=`<div>員編＋姓名：${employee.員編} ${employee.姓名}</div><div>卡號：${employee.卡號||""}</div>`;const wrapper=document.createElement("div");wrapper.className="attendance-wrapper";const table=document.createElement("table");table.className="attendance-table";table.innerHTML=`<thead><tr><th>日期</th><th>門別</th><th>最早時間<br>上班</th><th>最晚時間<br>下班</th></tr></thead><tbody>${(employee.出勤||[]).map(day=>`<tr><td>${day.日期||""}</td><td>${day.門別||""}</td><td>${day.最早時間||""}</td><td>${day.最晚時間||""}</td></tr>`).join("")}</tbody>`;wrapper.appendChild(table);const backButton=document.createElement("button");backButton.className="back-button";backButton.textContent="返回員工列表";backButton.addEventListener("click",()=>{locationNav.style.display="flex";renderLocationNavigation(employeeData);renderEmployees(searchInput.value)});card.append(title,info,wrapper,backButton);employeeContainer.appendChild(card);card.scrollIntoView({behavior:"smooth",block:"start"})}

searchInput.addEventListener("input",event=>{locationNav.style.display="flex";renderLocationNavigation(
  employeeData.filter(e=>String(e.員編).toLowerCase().includes(event.target.value.trim().toLowerCase())||String(e.姓名).toLowerCase().includes(event.target.value.trim().toLowerCase())));
                                             renderEmployees(event.target.value)});

fetch("員工出勤資料.json").then(response=>{if(!response.ok)throw new Error(`HTTP錯誤：${response.status}`);return response.json()}).then(data=>{
  employeeData=data;loading.style.display="none";renderLocationNavigation(employeeData);renderEmployees()}).catch(error=>{console.error(error);loading.style.display="none";errorMessage.style.display="block"});
</script>
</body>
</html>
