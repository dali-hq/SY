<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>員工門別查詢</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f4f6f8;color:#263238;font-family:Arial,"Microsoft JhengHei",sans-serif}.container{max-width:1400px;margin:auto}h1{text-align:center;color:#1f4e79}.search-box{margin:20px 0}#searchInput{width:100%;padding:12px 16px;border:1px solid #b0bec5;border-radius:8px;font-size:16px;background:#fff}#searchInput:focus{outline:none;border-color:#1976d2;box-shadow:0 0 0 3px #1976d226}.location-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;padding:12px;background:#fff;border:1px solid #d8e0e5;border-radius:8px}.location-nav-title{width:100%;color:#455a64;font-size:15px;font-weight:bold}.location-link{padding:8px 12px;border:1px solid #90a4ae;border-radius:6px;background:#f8fafb;color:#1f4e79;font-size:14px;cursor:pointer}.location-link:hover,.location-link.active{background:#1f4e79;border-color:#1f4e79;color:#fff}#resultInfo{margin:14px 0;color:#607d8b}.location-card{margin-bottom:20px;overflow:hidden;background:#fff;border-radius:10px;box-shadow:0 2px 8px #00000014;scroll-margin-top:20px}.location-title{padding:12px 16px;background:#1f4e79;color:#fff;font-size:19px;font-weight:bold}.employee-grid{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:10px;padding:16px}.employee-item{display:block;padding:12px 8px;border:1px solid #cfd8dc;border-radius:6px;background:#fafafa;color:#263238;text-align:center;text-decoration:none;font-size:15px;cursor:pointer}.employee-item:hover{border-color:#1976d2;background:#e3f2fd;color:#0d47a1}#noResult{display:none;padding:24px;text-align:center;background:#fff;border-radius:8px;color:#78909c}#loading{padding:24px;text-align:center;color:#607d8b}#errorMessage{display:none;padding:16px;color:#b71c1c;background:#ffebee;border-radius:8px}@media(max-width:1000px){.employee-grid{grid-template-columns:repeat(4,minmax(140px,1fr))}}@media(max-width:600px){body{padding:12px}.employee-grid{grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px;padding:10px}.employee-item{font-size:14px}}
</style>
</head>
<body>
<main class="container">
<h1>員工門別查詢</h1>
<div class="search-box"><input type="search" id="searchInput" placeholder="請輸入員編或姓名" autocomplete="off"></div>
<div id="locationNav" class="location-nav"></div>
<div id="resultInfo"></div>
<div id="loading">資料載入中...</div>
<div id="errorMessage">JSON 資料載入失敗，請確認 JSON 檔案位置。</div>
<div id="employeeContainer"></div>
<div id="noResult">找不到符合的員工資料</div>
</main>

<script>
let employeeData=[];const searchInput=document.getElementById("searchInput"),locationNav=document.getElementById("locationNav"),employeeContainer=document.getElementById("employeeContainer"),noResult=document.getElementById("noResult"),resultInfo=document.getElementById("resultInfo"),loading=document.getElementById("loading"),errorMessage=document.getElementById("errorMessage");

function renderLocationNavigation(data){locationNav.innerHTML="";const title=document.createElement("div");title.className="location-nav-title";title.textContent="門別快速前往";locationNav.appendChild(title);const locations=[...new Set(data.map(e=>e.顯示門別))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));locations.forEach((location,index)=>{const button=document.createElement("button");button.type="button";button.className="location-link";button.textContent=location;button.addEventListener("click",()=>{const target=document.getElementById(`location-${index}`);if(target)target.scrollIntoView({behavior:"smooth",block:"start"});document.querySelectorAll(".location-link").forEach(link=>link.classList.remove("active"));button.classList.add("active")});locationNav.appendChild(button)})}

function renderEmployees(keyword=""){const searchText=keyword.trim().toLowerCase(),filteredData=employeeData.filter(e=>String(e.員編).toLowerCase().includes(searchText)||String(e.姓名).toLowerCase().includes(searchText));filteredData.sort((a,b)=>{const locationCompare=String(a.顯示門別).localeCompare(String(b.顯示門別),"zh-Hant");return locationCompare||Number(a.員編)-Number(b.員編)});employeeContainer.innerHTML="";resultInfo.textContent=`共 ${filteredData.length} 位員工`;if(!filteredData.length){noResult.style.display="block";return}noResult.style.display="none";const grouped={};filteredData.forEach(e=>(grouped[e.顯示門別]??=[]).push(e));Object.keys(grouped).sort((a,b)=>a.localeCompare(b,"zh-Hant")).forEach((location,index)=>{const card=document.createElement("section");card.className="location-card";card.id=`location-${index}`;const title=document.createElement("div");title.className="location-title";title.textContent=location;const grid=document.createElement("div");grid.className="employee-grid";grouped[location].sort((a,b)=>Number(a.員編)-Number(b.員編)).forEach(e=>{const item=document.createElement("a");item.className="employee-item";item.href="#";item.textContent=`${e.員編} ${e.姓名}`;item.addEventListener("click",event=>{event.preventDefault();alert(`之後將開啟 ${e.員編} ${e.姓名} 的當月工表`)});grid.appendChild(item)});card.append(title,grid);employeeContainer.appendChild(card)})}

searchInput.addEventListener("input",e=>renderEmployees(e.target.value));

fetch("員工最後門別.json").then(response=>{if(!response.ok)throw new Error(`HTTP錯誤：${response.status}`);return response.json()}).then(data=>{employeeData=data;loading.style.display="none";renderLocationNavigation(employeeData);renderEmployees()}).catch(error=>{console.error(error);loading.style.display="none";errorMessage.style.display="block"});
</script>
</body>
</html>
