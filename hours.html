<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工出勤系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls select, .controls button {
            padding: 10px 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .controls select:focus, .controls button:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .controls button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .table-container {
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        thead th {
            padding: 15px 10px;
            text-align: center;
            font-weight: 600;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr {
            border-bottom: 1px solid #dee2e6;
            transition: all 0.3s;
        }

        tbody tr:hover {
            background: #f8f9fa;
            transform: scale(1.01);
        }

        tbody td {
            padding: 12px 10px;
            text-align: center;
            vertical-align: middle;
        }

        .employee-row td {
            font-weight: 600;
            background: #e9ecef;
        }

        .attendance-row td {
            background: white;
        }

        .work-hours-8 {
            color: #28a745;
            font-weight: bold;
        }

        .work-hours-4 {
            color: #fd7e14;
            font-weight: bold;
        }

        .work-hours-none {
            color: #dc3545;
            font-weight: bold;
        }

        .system-ot-2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        .system-ot-1 {
            background: #fd7e14;
            color: white;
            font-weight: bold;
        }

        .status-abnormal {
            color: #dc3545;
            font-weight: bold;
        }

        .status-half {
            color: #fd7e14;
            font-weight: bold;
        }

        .late-positive {
            color: #dc3545;
            font-weight: bold;
        }

        .date-cell {
            white-space: nowrap;
            font-weight: 500;
        }

        .location-cell {
            white-space: nowrap;
        }

        .time-cell {
            white-space: nowrap;
            font-family: 'Courier New', monospace;
        }

        .note-cell {
            min-width: 100px;
        }

        .note-input {
            width: 100%;
            padding: 5px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            table {
                font-size: 11px;
            }

            thead th {
                padding: 10px 5px;
            }

            tbody td {
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 員工出勤系統</h1>
            <p>出勤資料視覺化與分析</p>
        </div>

        <div class="controls">
            <select id="locationFilter">
                <option value="">全部門別</option>
            </select>
            <select id="employeeFilter">
                <option value="">全部員工</option>
            </select>
            <button onclick="renderTable()">🔄 重新整理</button>
            <button onclick="exportToCSV()">📥 匯出 CSV</button>
        </div>

        <div class="table-container">
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>門別</th>
                        <th>員編</th>
                        <th>姓名</th>
                        <th>卡號</th>
                        <th>遲到累計 (min)</th>
                        <th>日期</th>
                        <th>門別</th>
                        <th>上班</th>
                        <th>下班</th>
                        <th>工時</th>
                        <th>系統加班</th>
                        <th>狀態</th>
                        <th>備註</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let attendanceData = [];
        let filteredData = [];

        // 設定要載入的月分檔案
        const MONTHS_TO_LOAD = [
            '員工出勤資料_09月.json',
            '員工出勤資料_10月.json'
            // 之後要加 11 月，就在這裡加 '員工出勤資料_11 月.json'
        ];

        // 門別簡稱對照（方案 B 使用）
        const locationShortNames = {
            "11305 北港臉型機": "北港",
            "11203 大里農會": "大里",
            "11301 南七": "南七",
            "11402 嘉義配水池": "嘉配",
            "10001 大門": "總公司",
            "11211 九樓": "總公司"
        };

        // 載入 JSON 資料
        async function loadData() {
            try {
                const responses = await Promise.all(
                    MONTHS_TO_LOAD.map(url => fetch(url))
                );

                const allData = await Promise.all(
                    responses.map(res => res.json())
                );

                attendanceData = mergeMonthlyData(allData);
                
                initFilters();
                renderTable();
            } catch (error) {
                console.error('載入資料失敗:', error);
                alert('載入資料失敗，請確認 JSON 檔案是否存在');
            }
        }

        // 合併多個月分資料
        function mergeMonthlyData(monthlyDataArray) {
            const employeeMap = new Map();

            monthlyDataArray.forEach(monthData => {
                monthData.forEach(employee => {
                    const key = employee.員編;
                    
                    if (employeeMap.has(key)) {
                        const existing = employeeMap.get(key);
                        existing.出勤 = existing.出勤.concat(employee.出勤);
                        
                        // 累計遲到分鐘數
                        existing.遲到累計 = (existing.遲到累計 || 0) + (employee.遲到累計 || 0);
                    } else {
                        employeeMap.set(key, { ...employee });
                    }
                });
            });

            return Array.from(employeeMap.values()).sort((a, b) => {
                const aNum = parseInt(a.員編) || 999999999;
                const bNum = parseInt(b.員編) || 999999999;
                return aNum - bNum;
            });
        }

        // 初始化篩選器
        function initFilters() {
            const locationFilter = document.getElementById('locationFilter');
            const employeeFilter = document.getElementById('employeeFilter');

            // 清空現有選項
            locationFilter.innerHTML = '<option value="">全部門別</option>';
            employeeFilter.innerHTML = '<option value="">全部員工</option>';

            // 門別篩選
            const locations = [...new Set(attendanceData.map(emp => emp.顯示門別))];
            locations.sort().forEach(loc => {
                const option = document.createElement('option');
                option.value = loc;
                option.textContent = loc;
                locationFilter.appendChild(option);
            });

            // 員工篩選
            attendanceData.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.員編;
                option.textContent = `${emp.姓名} (${emp.員編})`;
                employeeFilter.appendChild(option);
            });

            // 監聽篩選事件
            locationFilter.addEventListener('change', filterData);
            employeeFilter.addEventListener('change', filterData);
        }

        // 篩選資料
        function filterData() {
            const locationFilter = document.getElementById('locationFilter').value;
            const employeeFilter = document.getElementById('employeeFilter').value;

            filteredData = attendanceData.filter(emp => {
                const matchLocation = !locationFilter || emp.顯示門別 === locationFilter;
                const matchEmployee = !employeeFilter || emp.員編 === employeeFilter;
                return matchLocation && matchEmployee;
            });

            renderTable();
        }

        // 取得門別簡稱
        function getLocationShortName(locationFull) {
            if (!locationFull || locationFull === "nan") return "";
            
            // 優先使用對照表
            const shortName = locationShortNames[locationFull];
            if (shortName) return shortName;
            
            // 若對照表沒有，嘗試從完整名稱中萃取關鍵字
            if (locationFull.includes("北港")) return "北港";
            if (locationFull.includes("大里")) return "大里";
            if (locationFull.includes("南七")) return "南七";
            if (locationFull.includes("嘉義")) return "嘉配";
            if (locationFull.includes("大門") || locationFull.includes("九樓")) return "總公司";
            
            return locationFull;
        }

        // 計算工時、加班、狀態（方案 B 使用）
        function computeAttendanceFields(earliestTime, latestTime) {
            if (!earliestTime || !latestTime) {
                return {
                    workHours: null,
                    systemOt: null,
                    status: "休"
                };
            }

            const baseDate = new Date('1900-01-01');
            const startTime = new Date(`1900-01-01 ${earliestTime}`);
            const endTime = new Date(`1900-01-01 ${latestTime}`);

            // 正常區間
            const normalMorningStart = new Date('1900-01-01 08:00:00');
            const normalMorningEnd = new Date('1900-01-01 12:00:00');
            const normalAfternoonStart = new Date('1900-01-01 13:00:00');
            const normalAfternoonEnd = new Date('1900-01-01 17:00:00');

            // 計算交集（以毫秒為單位）
            function intersectionMilliseconds(start, end, segStart, segEnd) {
                const left = new Date(Math.max(start.getTime(), segStart.getTime()));
                const right = new Date(Math.min(end.getTime(), segEnd.getTime()));
                if (left >= right) return 0;
                return right.getTime() - left.getTime();
            }

            const normalMs = (
                intersectionMilliseconds(startTime, endTime, normalMorningStart, normalMorningEnd) +
                intersectionMilliseconds(startTime, endTime, normalAfternoonStart, normalAfternoonEnd)
            );

            const normalHours = normalMs / (1000 * 60 * 60);

            // 工時顯示
            let workHours;
            if (normalHours >= 8) {
                workHours = 8;
            } else if (normalHours >= 4) {
                workHours = 4;
            } else {
                workHours = null;
            }

            // 早上加班：起點 <= 07:00 且有正常工時
            const otStartLimit = new Date('1900-01-01 07:00:00');
            let morningOt = null;
            if (workHours !== null && startTime <= otStartLimit) {
                morningOt = 1;
            }

            // 晚上加班：終點 >= 18:00 且有正常工時
            const otEndLimit = new Date('1900-01-01 18:00:00');
            let eveningOt = null;
            if (workHours !== null && endTime >= otEndLimit) {
                eveningOt = 1;
            }

            // 系統加班
            let systemOt;
            if (morningOt === null && eveningOt === null) {
                systemOt = null;
            } else if (morningOt !== null && eveningOt === null) {
                systemOt = 1;
            } else if (morningOt === null && eveningOt !== null) {
                systemOt = 1;
            } else {
                systemOt = 2;
            }

            // 狀態
            let status;
            if (workHours === null) {
                status = "異常";
            } else if (workHours === 4) {
                status = "上半天";
            } else if (workHours === 8) {
                status = "";
            } else {
                status = "待確認";
            }

            return {
                workHours,
                systemOt,
                status
            };
        }

        // 渲染表格
        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            filteredData.forEach(employee => {
                // 員工列
                const employeeRow = document.createElement('tr');
                employeeRow.className = 'employee-row';

                const locationCell = document.createElement('td');
                locationCell.textContent = employee.顯示門別;
                locationCell.colSpan = 4;

                const lateCell = document.createElement('td');
                lateCell.textContent = employee.遲到累計 || 0;
                if ((employee.遲到累計 || 0) > 0) {
                    lateCell.className = 'late-positive';
                }

                employeeRow.appendChild(locationCell);
                employeeRow.appendChild(lateCell);

                // 日期與出勤資料
                employee.出勤.forEach(day => {
                    const attendanceRow = document.createElement('tr');
                    attendanceRow.className = 'attendance-row';

                    // 日期
                    const dateCell = document.createElement('td');
                    dateCell.className = 'date-cell';
                    const dateObj = new Date(day.日期);
                    dateCell.textContent = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                    attendanceRow.appendChild(dateCell);

                    // 門別簡稱
                    const locationShortCell = document.createElement('td');
                    locationShortCell.className = 'location-cell';
                    locationShortCell.textContent = day.門別簡稱 || getLocationShortName(day.門別);
                    attendanceRow.appendChild(locationShortCell);

                    // 上班時間
                    const startTimeCell = document.createElement('td');
                    startTimeCell.className = 'time-cell';
                    startTimeCell.textContent = day.最早時間 || '';
                    attendanceRow.appendChild(startTimeCell);

                    // 下班時間
                    const endTimeCell = document.createElement('td');
                    endTimeCell.className = 'time-cell';
                    endTimeCell.textContent = day.最晚時間 || '';
                    attendanceRow.appendChild(endTimeCell);

                    // 工時
                    const workHoursCell = document.createElement('td');
                    if (day.工時 !== null && day.工時 !== undefined) {
                        workHoursCell.textContent = day.工時;
                        if (day.工時 === 8) {
                            workHoursCell.className = 'work-hours-8';
                        } else if (day.工時 === 4) {
                            workHoursCell.className = 'work-hours-4';
                        } else {
                            workHoursCell.className = 'work-hours-none';
                        }
                    } else {
                        // 方案 B：自行計算
                        const result = computeAttendanceFields(day.最早時間, day.最晚時間);
                        workHoursCell.textContent = result.workHours !== null ? result.workHours : '';
                        if (result.workHours === 8) {
                            workHoursCell.className = 'work-hours-8';
                        } else if (result.workHours === 4) {
                            workHoursCell.className = 'work-hours-4';
                        } else if (result.workHours === null) {
                            workHoursCell.className = 'work-hours-none';
                        }
                    }
                    attendanceRow.appendChild(workHoursCell);

                    // 系統加班
                    const systemOtCell = document.createElement('td');
                    if (day.系統加班 !== null && day.系統加班 !== undefined) {
                        systemOtCell.textContent = day.系統加班;
                        if (day.系統加班 === 2) {
                            systemOtCell.className = 'system-ot-2';
                        } else if (day.系統加班 === 1) {
                            systemOtCell.className = 'system-ot-1';
                        }
                    } else {
                        // 方案 B：自行計算
                        const result = computeAttendanceFields(day.最早時間, day.最晚時間);
                        systemOtCell.textContent = result.systemOt !== null ? result.systemOt : '';
                        if (result.systemOt === 2) {
                            systemOtCell.className = 'system-ot-2';
                        } else if (result.systemOt === 1) {
                            systemOtCell.className = 'system-ot-1';
                        }
                    }
                    attendanceRow.appendChild(systemOtCell);

                    // 狀態
                    const statusCell = document.createElement('td');
                    if (day.狀態 !== null && day.狀態 !== undefined && day.狀態 !== "") {
                        statusCell.textContent = day.狀態;
                        if (day.狀態 === "異常") {
                            statusCell.className = 'status-abnormal';
                        } else if (day.狀態 === "上半天") {
                            statusCell.className = 'status-half';
                        }
                    } else {
                        // 方案 B：自行計算
                        const result = computeAttendanceFields(day.最早時間, day.最晚時間);
                        statusCell.textContent = result.status;
                        if (result.status === "異常") {
                            statusCell.className = 'status-abnormal';
                        } else if (result.status === "上半天") {
                            statusCell.className = 'status-half';
                        }
                    }
                    attendanceRow.appendChild(statusCell);

                    // 備註
                    const noteCell = document.createElement('td');
                    noteCell.className = 'note-cell';
                    const noteInput = document.createElement('input');
                    noteInput.type = 'text';
                    noteInput.className = 'note-input';
                    noteInput.value = day.備註 || '';
                    noteInput.placeholder = '輸入備註';
                    noteCell.appendChild(noteInput);
                    attendanceRow.appendChild(noteCell);

                    tableBody.appendChild(attendanceRow);
                });
            });
        }

        // 匯出 CSV
        function exportToCSV() {
            let csv = '門別，員編，姓名，卡號，遲到累計，日期，門別簡稱，上班，下班，工時，系統加班，狀態，備註\n';

            filteredData.forEach(employee => {
                employee.出勤.forEach(day => {
                    const dateObj = new Date(day.日期);
                    const dateStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                    const locationShort = day.門別簡稱 || getLocationShortName(day.門別);
                    const workHours = day.工時 !== null && day.工時 !== undefined ? day.工時 : '';
                    const systemOt = day.系統加班 !== null && day.系統加班 !== undefined ? day.系統加班 : '';
                    const status = day.狀態 || '';
                    const note = day.備註 || '';

                    csv += `${employee.顯示門別},${employee.員編},${employee.姓名},${employee.卡號},${employee.遲到累計 || 0},${dateStr},${locationShort},${day.最早時間 || ''},${day.最晚時間 || ''},${workHours},${systemOt},${status},${note}\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '員工出勤資料.csv';
            link.click();
        }

        // 頁面載入時初始化
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
