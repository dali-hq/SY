<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>員工編號與門別查詢 / 請假系統</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .box { margin-bottom: 20px; }
        select, input { padding: 5px; font-size: 16px; }
        table { border-collapse: collapse; width: 50%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .form-section { margin-top: 40px; padding: 20px; border: 1px solid #ddd; width: 50%; background: #f9f9f9; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: inline-block; width: 100px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>員工門別查詢系統</h2>

    <div class="box">
        <label for="doorSelect"><strong>選擇門別：</strong></label>
        <select id="doorSelect" onchange="filterEmployees()">
            <option value="">-- 請選擇門別 --</option>
        </select>
    </div>

    <table id="empTable">
        <thead>
            <tr>
                <th>員編</th>
                <th>姓名</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="2">請先選擇門別</td></tr>
        </tbody>
    </table>

    <!-- 請假填寫表單 -->
    <div class="form-section">
        <h3>請假登記表</h3>
        <form id="leaveForm" onsubmit="submitLeave(event)">
            <div class="form-group">
                <label for="leaveSite">工地(門別):</label>
                <input type="text" id="leaveSite" required placeholder="系統自動帶入或手動輸入">
            </div>
            <div class="form-group">
                <label for="leaveId">員編:</label>
                <input type="text" id="leaveId" required placeholder="請輸入員編" oninput="autoFillName()">
            </div>
            <div class="form-group">
                <label for="leaveName">姓名:</label>
                <input type="text" id="leaveName" required placeholder="依員編自動帶入" readonly style="background-color: #eee;">
            </div>
            <div class="form-group">
                <label for="leaveStart">起始日期:</label>
                <input type="date" id="leaveStart" required>
            </div>
            <div class="form-group">
                <label for="leaveEnd">結束日期:</label>
                <input type="date" id="leaveEnd" required>
            </div>
            <div class="form-group">
                <label for="leaveSubmitter">填寫人:</label>
                <input type="text" id="leaveSubmitter" required placeholder="請輸入您的名字">
            </div>
            <button type="submit" style="padding: 8px 16px; font-size: 16px; background-color: #4CAF50; color: white; border: none; cursor: pointer;">送出請假</button>
        </form>
    </div>

    <script>
        const WEB_APP_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQot-_Zd07NmatBFEzPhMV5ZqpfczSCvisf71o6R51_CGkyKzeau3w9zT9h9theEMZAZavryoi9D9oeIaHxNm9_Ms71pnPFkktv3jmDeK2AGflQmXFyzLQk8Mu-GJcybmZNiV9oO2lGd0Ja3igJ0h9N7GG4udTT51aDHZ8BZgSRVgdHW7Cz4SJNiPLoXpDUbQFjwaoDmXiW6HK5UtXmc2S7OwxShdxwc5ixYVW3u2oHiAEHzYRfYPtqBATeCKratt1lIwZnhdJGp7GrdvtWTsVANeXVgw&lib=M35pRcTv8qkURBaBOB5VwwvGCLzMoQw4c";

        let allData = [];

        // 頁面載入時抓取資料
        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                allData = data;
                initDoorDropdown(data);
            })
            .catch(error => console.error("讀取資料失敗:", error));

        // 初始化門別下拉選單
        function initDoorDropdown(data) {
            const doors = [...new Set(data.map(item => String(item.door).trim()).filter(d => d !== "" && d !== "undefined"))];
            doors.sort();

            const select = document.getElementById("doorSelect");
            doors.forEach(door => {
                const option = document.createElement("option");
                option.value = door;
                option.textContent = door;
                select.appendChild(option);
            });
        }

        // 根據選取的門別過濾員編與姓名
        function filterEmployees() {
            const selectedDoor = document.getElementById("doorSelect").value.trim();
            const tbody = document.querySelector("#empTable tbody");
            tbody.innerHTML = "";

            // 同步將選取的門別帶入請假表單的工地欄位
            if (selectedDoor) {
                document.getElementById("leaveSite").value = selectedDoor;
            }

            if (!selectedDoor) {
                tbody.innerHTML = `<tr><td colspan="2">請先選擇門別</td></tr>`;
                return;
            }

            const filtered = allData.filter(item => String(item.door).trim() === selectedDoor);

            const uniqueMap = new Map();
            filtered.forEach(item => {
                if (item.id !== undefined && item.id !== null && String(item.id).trim() !== "") {
                    uniqueMap.set(String(item.id).trim(), String(item.name).trim());
                }
            });

            const sortedEmployees = Array.from(uniqueMap.entries()).sort((a, b) => String(a[0]).localeCompare(String(b[0])));

            if (sortedEmployees.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2">此門別無人員資料</td></tr>`;
                return;
            }

            sortedEmployees.forEach(([id, name]) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${id}</td><td>${name}</td>`;
                tbody.appendChild(tr);
            });
        }

        // 依據輸入的員編自動帶出姓名
        function autoFillName() {
            const inputId = document.getElementById("leaveId").value.trim();
            const nameField = document.getElementById("leaveName");

            if (!inputId) {
                nameField.value = "";
                return;
            }

            // 從全域資料中尋找符合該員編的人
            const matched = allData.find(item => String(item.id).trim() === inputId);
            if (matched) {
                nameField.value = matched.name;
            } else {
                nameField.value = "查無此員編（可手動或確認）";
            }
        }

        // 送出請假表單到 GAS
        function submitLeave(event) {
            event.preventDefault();

            const payload = {
                site: document.getElementById("leaveSite").value,
                id: document.getElementById("leaveId").value,
                name: document.getElementById("leaveName").value,
                startDate: document.getElementById("leaveStart").value,
                endDate: document.getElementById("leaveEnd").value,
                submitter: document.getElementById("leaveSubmitter").value
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert("請假送出成功！");
                    document.getElementById("leaveForm").reset();
                } else {
                    alert("送出失敗：" + res.message);
                }
            })
            .catch(err => {
                console.error("Error:", err);
                alert("連線發生錯誤，請稍後再試。");
            });
        }
    </script>

</body>
</html>
