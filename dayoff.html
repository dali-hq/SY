<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>實毅 - 員工請假登錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary-color:#059669;--primary-hover:#047857;--bg-color:#f0fdf4;--card-bg:#ffffff;--text-color:#1f2937;--border-color:#10b981}
body{font-family:"Noto Serif TC",serif;background-color:var(--bg-color);color:var(--text-color);margin:0;padding:40px 20px;display:flex;justify-content:center}
.container{width:100%;max-width:650px}
.card{background-color:var(--card-bg);border-radius:12px;box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.12);padding:30px;border:1px solid #d1fae5}
h2{color:#065f46;margin-top:0;margin-bottom:24px;text-align:center;font-size:22px;font-weight:700}
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:6px;font-weight:700;font-size:20px;text-align:center;color:#065f46}
input{width:100%;padding:12px 14px;font-size:18px;border:1px solid var(--border-color);border-radius:6px;box-sizing:border-box;font-family:"Noto Serif TC",serif;text-align:center}
input:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(5,150,105,0.15)}
input[readonly]{background-color:#f0fdf4;color:#6b7280;border-color:#6ee7b7}
.btn-submit{background-color:var(--primary-color);color:white;border:none;padding:14px 20px;font-size:18px;font-weight:700;border-radius:6px;cursor:pointer;width:100%;font-family:"Noto Serif TC",serif;box-shadow:0 4px 6px -1px rgba(5,150,105,0.3)}
.btn-submit:hover{background-color:var(--primary-hover);transform:translateY(-2px)}
.form-row{display:flex;gap:15px;margin-bottom:18px}
.form-row .form-group{width:calc((100% - 30px)/3);margin-bottom:0}
.note{text-align:center;font-size:16px;color:#065f46;margin-top:20px;font-weight:600}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:white;border-radius:12px;padding:30px;max-width:400px;width:90%;box-shadow:0 20px 25px -5px rgb(0 0 0 / 0.2);border:1px solid #a7f3d0}
.modal h3{margin-top:0;margin-bottom:20px;text-align:center;font-size:20px;color:#065f46;font-weight:700}
.modal-info{background:#f0fdf4;padding:20px;border-radius:8px;margin-bottom:20px;font-size:16px;line-height:2;text-align:left;border:1px solid #a7f3d0}
.modal-info-row{margin-bottom:10px}
.modal-info-row:last-child{margin-bottom:0}
.modal-info-row.inline{display:flex;justify-content:flex-start;gap:30px}
.modal-buttons{display:flex;gap:15px;justify-content:center}
.modal-btn{padding:10px 30px;font-size:16px;font-weight:600;border:none;border-radius:6px;cursor:pointer;font-family:"Noto Serif TC",serif}
.modal-btn-confirm{background:var(--primary-color);color:white;border:2px solid var(--primary-color)}
.modal-btn-cancel{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h2>實毅 - 員工請假登錄</h2>
<form id="leaveForm" onsubmit="showConfirm(event)">
<div class="form-row">
<div class="form-group"><label>工號</label><input type="text" id="leaveId" oninput="autoFillNameAndSite()" maxlength="5"></div>
<div class="form-group"><label>姓名</label><input type="text" id="leaveName" required placeholder="系統代入" readonly maxlength="4"></div>
<div class="form-group"><label>所屬工地</label><input type="text" id="leaveSite" required placeholder="系統帶入或手動輸入" maxlength="7"></div>
</div>
<div class="form-row">
<div class="form-group"><label>起始日期</label><input type="date" id="leaveStart" required></div>
<div class="form-group"><label>結束日期</label><input type="date" id="leaveEnd" required></div>
<div class="form-group"><label>填寫人</label><input type="text" id="leaveSubmitter" required placeholder="請輸入您的名字"></div>
</div>
<button type="submit" class="btn-submit">送出</button>
</form>
<div class="note">說明：此表單為請假單通過後填寫</div>
</div>
</div>
<div class="modal-overlay" id="confirmModal">
<div class="modal">
<h3>請核對填寫資訊</h3>
<div class="modal-info" id="modalInfo"></div>
<div class="modal-buttons">
<button type="button" class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
<button type="button" class="modal-btn modal-btn-confirm" id="confirmBtn" onclick="confirmSubmit()">正確</button>
</div>
</div>
</div>
<script src="employees.js"></script>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbwlRsQsfrj6QR5cFWtAEQa70ewFTZPkuWBDHbF7KMb182ORnUBL8Dn1mjWd_bsnTkPDfg/exec";
window.addEventListener('DOMContentLoaded',()=>{const today=new Date().toISOString().split('T')[0];document.getElementById('leaveStart').value=today;document.getElementById('leaveEnd').value=today;});
function autoFillNameAndSite(){const inputId=document.getElementById("leaveId").value.trim();const nameField=document.getElementById("leaveName");const siteField=document.getElementById("leaveSite");if(!inputId){nameField.value="";siteField.value="";return;}const matched=EMPLOYEE_DB.find(item=>String(item.id).trim()===String(inputId).trim());if(matched){nameField.value=matched.name||"";siteField.value=matched.door||"";}else{nameField.value="查無此員編";siteField.value="";}}
function showConfirm(event){event.preventDefault();const id=document.getElementById("leaveId").value;const name=document.getElementById("leaveName").value;const site=document.getElementById("leaveSite").value;const start=document.getElementById("leaveStart").value;const end=document.getElementById("leaveEnd").value;const info=`<div class="modal-info-row inline"><span><strong>工號：</strong>${id}</span><span><strong>姓名：</strong>${name}</span></div><div class="modal-info-row"><strong>所屬工地：</strong>${site}</div><div class="modal-info-row"><strong>起訖時間：</strong>${start} 至 ${end}</div>`;document.getElementById("modalInfo").innerHTML=info;document.getElementById("confirmModal").classList.add("active");document.getElementById("confirmBtn").focus();}
function closeModal(){document.getElementById("confirmModal").classList.remove("active");}
function confirmSubmit(){closeModal();const submitBtn=document.querySelector('.btn-submit');submitBtn.textContent="傳送中...";submitBtn.disabled=true;const payload={site:document.getElementById("leaveSite").value,id:document.getElementById("leaveId").value,name:document.getElementById("leaveName").value,startDate:document.getElementById("leaveStart").value,endDate:document.getElementById("leaveEnd").value,submitter:document.getElementById("leaveSubmitter").value};fetch(WEB_APP_URL,{method:"POST",body:JSON.stringify(payload)}).then(res=>res.json()).then(res=>{if(res.status==="success"){alert("請假送出成功！");document.getElementById("leaveForm").reset();const today=new Date().toISOString().split('T')[0];document.getElementById('leaveStart').value=today;document.getElementById('leaveEnd').value=today;}else{alert("送出失敗："+res.message);}}).catch(err=>{console.error("Error:",err);alert("連線發生錯誤，請稍後再試。");}).finally(()=>{submitBtn.textContent="送出";submitBtn.disabled=false;});}
document.getElementById('confirmModal').addEventListener('keydown',(e)=>{if(e.key==='Escape'){closeModal();}});
</script>
</body>
</html>
