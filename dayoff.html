<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>員工編號與門別查詢</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .box { margin-bottom: 20px; }
        select { padding: 5px; font-size: 16px; }
        table { border-collapse: collapse; width: 50%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>員工門別查詢系統</h2>

    <div class="box">
        <label for="doorSelect"><strong>選擇門別：</strong></label>
        <select id="doorSelect" onchange="filterEmployees()">
            <option value="">-- 請選擇門別 --</option>
        </select>
    </div>

    <table id="empTable">
        <thead>
            <tr>
                <th>員編</th>
                <th>姓名</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="2">請先選擇門別</td></tr>
        </tbody>
    </table>

    <script>
        // 【請將這裡換成您剛剛部署好的 Apps Script 網址】
        const WEB_APP_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQ8A3EiKr2zoQp4y711wse0Wf6TKJyPlcOgBf4Goc0Z_oBypO6R_HtSTgqAL76NHCbeFjtCGZXi4Y5IZLuvn2zwun6etXxwFpa1s26vX7wKLDSyvn4gvzvQlV32QtQEcninAEcE1iiwFldig8f-1SJpF2k5hi0ThXzLJX8a0RDgbPbkenYNRHHWiwWSUiGmj41HUgQB4pl9gNPqN81Ku2Up8kcwTUhej8qNGcQooap7i3PwuFYsSlaV7zl8NaHTaNdxJUHhie28T0pxNKMkETQd_dGSXw&lib=M35pRcTv8qkURBaBOB5VwwvGCLzMoQw4c";

        let allData = [];

        // 頁面載入時抓取資料
        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                allData = data;
                initDoorDropdown(data);
            })
            .catch(error => console.error("讀取資料失敗:", error));

        // 初始化門別下拉選單（不重複且排序）
        function initDoorDropdown(data) {
            const doors = [...new Set(data.map(item => item.door).filter(d => d !== ""))];
            doors.sort(); // 排序門別

            const select = document.getElementById("doorSelect");
            doors.forEach(door => {
                const option = document.createElement("option");
                option.value = door;
                option.textContent = door;
                select.appendChild(option);
            });
        }

        // 根據選取的門別過濾員編與姓名（不重複且排序）
        function filterEmployees() {
            const selectedDoor = document.getElementById("doorSelect").value.trim();
            const tbody = document.querySelector("#empTable tbody");
            tbody.innerHTML = "";

            if (!selectedDoor) {
                tbody.innerHTML = `<tr><td colspan="2">請先選擇門別</td></tr>`;
                return;
            }

            const filtered = allData.filter(item => String(item.door).trim() === selectedDoor);

            const uniqueMap = new Map();
            filtered.forEach(item => {
                if (item.id !== undefined && item.id !== null && String(item.id).trim() !== "") {
                    uniqueMap.set(String(item.id).trim(), String(item.name).trim());
                }
            });

            // 強制轉成字串再做排序
            const sortedEmployees = Array.from(uniqueMap.entries()).sort((a, b) => String(a[0]).localeCompare(String(b[0])));

            if (sortedEmployees.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2">此門別無人員資料</td></tr>`;
                return;
            }

            sortedEmployees.forEach(([id, name]) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${id}</td><td>${name}</td>`;
                tbody.appendChild(tr);
            });
        }
    </script>

</body>
</html>
