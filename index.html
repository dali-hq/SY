<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="logo.png" type="image/png">
    <title>實毅營造員工</title>
    <script src="data.js"></script>
    <script src="dayoff.js"></script>
    <style>
        body {
            font-family: "Noto Serif TC", "Microsoft JhengHei", serif, sans-serif;
            text-align: center;
            background: #f5f7fa;
            padding: 15px;
            margin: 0;
        }

        /* 基礎卡片容器：在電腦版會透過 .wide 撐開 */
        .card { 
            background: white;
            padding: 25px;
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: block; 
            width: 100%;
            max-width: 450px;
            box-sizing: border-box; 
            margin: 10px auto;
            transition: max-width 0.3s; 
        }

        /* 電腦版撐開後的寬度 */
        .card.wide {
            max-width: 1450px;
        }

        /* 標題 Logo 樣式 */
        .page-title {
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 30px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .page-title img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        /* 搜尋區域 */
        .search-section {
            max-width: 400px;
            margin: 0 auto;
        }
        input {
            padding: 15px;
            border: 2px solid #9F0050;
            border-radius: 6px;
            font-size: 18px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-search {
            flex: 2;
            padding: 15px 0;
            background-color: #FF359A;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-clear {
            flex: 1;
            padding: 15px 0;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    
        /* 下方導覽列 */
        .nav-link { 
            margin-top: 25px; 
            padding-top: 15px; 
            border-top: 1px solid #eee; 
            font-size: 22px;
            line-height: 2.5; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: center;
            gap: 12px;
        }
        .nav-link a { 
            background: none !important;
            border: none !important;
            padding: 0 !important;
            color: #444; 
            text-decoration: none; 
            font-weight: bold; 
            cursor: pointer; 
            white-space: nowrap; 
            font-size: 22px;
            transition: color 0.2s;
        }
        .nav-link a:hover {
            color: #222;
            font-weight: bold !important;
            text-decoration: underline;
        }
        .nav-link span.divider {
            color: #bbb;
            font-weight: normal;
            font-size: 14px;
        }
        .nav-duty {
            color: #2c3e50 !important;
        }
        .nav-duty span {
            color: #27ae60 !important;
        }
    
        /* 容器：強化水平置中與高度對齊 */
        .result-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: stretch; 
            gap: 10px; 
            padding: 10px 0; 
            width: 100%; 
            margin: 0 auto; 
        }

        /* 員工卡片樣式 */
        .emp-card { 
            background: #fff; 
            border: 1px solid #333; 
            border-radius: 8px; 
            padding: 8px; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.08); 
            box-sizing: border-box; 
            text-align: center; 
            width: calc((100% - 15px) / 2); 
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            transition: transform 0.2s;
        }
        .emp-card:hover {
            transform: translateY(-2px);
        }
        
        /* 姓名與編號標籤 */
        .emp-card .emp-name-tag { 
            font-weight: bold; 
            font-size: 20px;
            margin-bottom: 6px; 
            color: #2c3e50; 
            border-bottom: 2px solid #f0f0f0; 
            padding-bottom: 4px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }

        /* 照片樣式 */
        .emp-card img { 
            width: 100%; 
            height: auto; 
            aspect-ratio: 3 / 4; 
            object-fit: cover; 
            border-radius: 6px; 
            border: 1px solid #eee; 
            flex-grow: 1;
        }

        .emp-card .emp-site-tag {
            font-size: 13px;
            color: #e67e22;
            margin-top: 6px;
            font-weight: bold;
        }

        /* 電腦版：強制定製一行 8 個 */
        @media (min-width: 1024px) {
            .result-container { 
                display: grid !important; 
                justify-content: center; 
                grid-template-columns: repeat(8, minmax(0, 1fr)) !important;
                max-width: 100% !important; 
                gap: 10px !important; 
                margin: 0 auto;
            }
            .emp-card { 
                width: 100% !important; 
                padding: 6px; 
            }
            .emp-card .emp-name-tag {
                font-size: 20px;
            }
        }

        /* 休假盒子 */
        #off-duty-box {
            margin: 30px auto 0 auto;
            padding: 14px;
            background: #fff0f0;
            border-radius: 12px;
            border: 1px solid #ffcccc;
            text-align: left;
            font-size: 18px;
            max-width: 450px;
        }

        /* 手機斷行控制 */
        @media (max-width: 600px) {
            .mobile-br { display: block; width: 100%; height: 0; }
        }
        @media (min-width: 601px) {
            .mobile-br { display: none; }
        }

        /* 列印專屬樣式 */
        @media print {
            @page {
                size: landscape;
                margin: 8mm;
            }
            body {
                background: white !important;
                padding: 0 !important;
            }
            .card, .card.wide {
                max-width: 100% !important;
                width: 100% !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .search-section, .btn-group, .nav-link, #off-duty-box {
                display: none !important;
            }
            .result-container {
                display: grid !important;
                grid-template-columns: repeat(8, minmax(0, 1fr)) !important;
                gap: 6px !important;
                width: 100% !important;
            }
            .emp-card {
                width: 100% !important;
                padding: 4px !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .emp-card .emp-name-tag {
                font-size: 13px !important; 
                margin-bottom: 3px !important;
                padding-bottom: 2px !important;
            }
            .emp-card .emp-site-tag {
                font-size: 11px !important;
                margin-top: 3px !important;
            }
        }

        /* 休假分組與起訖日期樣式 */
        .site-group {
            margin-bottom: 8px;
        }
        .site-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 2px;
        }
        .date-range {
            color: #333;
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <!-- 查詢頁面 -->
    <div id="page-search">
        <h2 class="page-title">
            <img src="logo.png" alt="Logo"> 實毅營造員工
        </h2>
        <div class="search-section">
            <input type="text" id="empId" placeholder="輸入工號或姓名 (空格區分=複數查詢)" onkeypress="if(event.keyCode==13) doSearch()">
            <div class="btn-group">
                <button class="btn-search" onclick="doSearch()">搜尋</button>
                <button class="btn-clear" onclick="clearSearch()">清空</button>
            </div>
        </div>
        <div id="result-display" class="result-container"></div>
    </div>

    <!-- 總覽頁面 -->
    <div id="page-overview" style="display:none;">
        <h2 class="page-title">
            <img src="logo.png" alt="Logo"> 實毅員工總覽
        </h2>
        <div id="result-overview" class="result-container"></div>
    </div>

<!-- 底部導覽 -->
<div class="nav-link">
    <a href="#" id="nav-search">查詢</a><span class="divider">●</span>
    <a href="#" id="nav-overview">總覽</a><span class="divider">●</span>
    <a href="duty.html" class="nav-duty">月曆</a>
</div>
</div>

<!-- 今日休假 -->
<div id="off-duty-box">
    <div style="font-weight:bold; color:#d63031; margin-bottom:8px;">📅 今日休假人員</div>
    <div id="off-list">讀取中...</div>
</div>

<script>
    window.onload = function() {
        // 1. 載入今日休假
        loadOffDuty();

        // 2. 綁定導覽列點擊事件，徹底阻止預設跳轉
        const navSearch = document.getElementById('nav-search');
        const navOverview = document.getElementById('nav-overview');

        if (navSearch) {
            navSearch.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('search');
            });
        }

        if (navOverview) {
            navOverview.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('overview');
            });
        }
    };

    function showPage(p) {
        const pages = ['search', 'overview'];
        pages.forEach(id => {
            const el = document.getElementById('page-' + id);
            if (el) el.style.display = 'none';
        });
        
        const card = document.getElementById('main-card');
        const targetPage = document.getElementById('page-' + p);
        if (targetPage) targetPage.style.display = 'block';

        if (p === 'overview') {
            card.classList.add('wide');
            renderCards('result-overview', WORKER_DATA);
        } else {
            const hasResults = document.getElementById('result-display').innerHTML.trim() !== '';
            if (hasResults && window.innerWidth >= 1024) {
                card.classList.add('wide');
            } else {
                card.classList.remove('wide');
            }
        }
    }

    // 渲染員工卡片
    function renderCards(targetId, list) {
        const div = document.getElementById(targetId);
        if (!div) return;
        if (!list || list.length === 0) {
            div.innerHTML = "<div style='width:100%; padding:20px;'>查無相關資料</div>";
            return;
        }
        list.sort((a, b) => (parseInt(a.id.toString().replace(/\D/g,'')) || 0) - (parseInt(b.id.toString().replace(/\D/g,'')) || 0));
        div.innerHTML = list.map(e => `
            <div class='emp-card'>
                <div class='emp-name-tag'>${e.id} ${e.name}</div>
                <img src='${e.photoUrl}' onerror="this.src='https://via.placeholder.com/150x200?text=No+Photo'">
                <div class='emp-site-tag'>${e.site ? '📍 ' + e.site : ''}</div>
            </div>
        `).join('');
    }
    
    function doSearch() {
        const val = document.getElementById('empId').value.trim();
        if (!val) {
            alert("請輸入工號或姓名");
            return;
        }
        
        const keywords = val.split(/\s+/);
        if (typeof WORKER_DATA === 'undefined') {
            alert("錯誤：無法讀取員工資料(WORKER_DATA missing)");
            return;
        }
        
        const results = WORKER_DATA.filter(w => 
            keywords.some(k => w.id.toString().includes(k) || w.name.includes(k))
        );
        
        renderCards('result-display', results);
        
        if (window.innerWidth >= 1024) {
            document.getElementById('main-card').classList.add('wide');
        }
    }

    function clearSearch() {
        document.getElementById('empId').value = '';
        document.getElementById('result-display').innerHTML = '';
        if (window.innerWidth >= 1024) {
             document.getElementById('main-card').classList.remove('wide');
        }
    }

    // 今日休假查詢（依工地分組）
    function loadOffDuty() {
        const offListEl = document.getElementById('off-list');
        if (!offListEl) return;
        
        if (typeof DAYOFF === 'undefined') {
            offListEl.innerHTML = "今日無人休假";
            return;
        }
        
        // 取得今天的「民國年」日期格式 (例如: 115/09/10)
        const now = new Date();
        const minguoYear = now.getFullYear() - 1911;
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const today = `${minguoYear}/${month}/${day}`;
        
        // 篩選出今天在休假區間內的名單
        const list = DAYOFF.filter(d => today >= d.start && today <= d.end);
        
        if (list.length === 0) {
            offListEl.innerHTML = "今日無人休假";
            return;
        }
        
        // 依照工地進行分組 (Group by site)
        const grouped = list.reduce((acc, item) => {
            const site = item.site || '其他工地';
            if (!acc[site]) {
                acc[site] = [];
            }
            acc[site].push(item);
            return acc;
        }, {});
        
        // 組合 HTML 畫面（每個工地一個群組）
        let html = '';
        for (const site in grouped) {
            html += `<div class="site-group">`;
            html += `<div class="site-title">📍 ${site}</div>`;
            
            const workersHtml = grouped[site].map(e => {
                return `&nbsp;&nbsp;• ${e.id} ${e.name} <span class="date-range">(${e.start.slice(5)}~${e.end.slice(5)})</span>`;
            }).join('<br>');
            
            html += workersHtml;
            html += `</div><br>`;
        }
        
        offListEl.innerHTML = html;
    }
</script>

</body>
</html>
